# Dependabot version updates: monthly, grouped so each ecosystem yields one PR for
# minor and patch bumps; major bumps come as separate PRs.
version: 2
updates:
  - package-ecosystem: docker
    directory: /fleet_adapter
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /rmf_dashboard
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /simulation
    schedule:
      interval: monthly
