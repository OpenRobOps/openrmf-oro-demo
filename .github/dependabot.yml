# Dependabot version updates: monthly, grouped so each ecosystem yields one PR for
# minor and patch bumps. Major bumps are ignored for packages and base images (they are
# taken deliberately by hand); GitHub Actions majors are still proposed.
version: 2
updates:
  - package-ecosystem: docker
    directory: /fleet_adapter
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /rmf_dashboard
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /simulation
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
