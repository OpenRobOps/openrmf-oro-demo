server {
  listen 80;

  location /assets {
    root /usr/share/nginx/html;
    add_header Cache-Control max-age=604800;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}