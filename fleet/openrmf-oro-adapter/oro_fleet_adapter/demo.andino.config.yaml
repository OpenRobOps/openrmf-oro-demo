rmf_fleet:
  name: "ORO"
  limits:
    linear: [0.4, 0.2] # velocity, acceleration
    angular: [0.6, 0.35] # velocity, acceleration
  profile: # Robot profile is modelled as a circle
    footprint: 0.5 # radius in m
    vicinity: 0.8 # radius in m
  reversible: False # whether robots in this fleet can reverse
  battery_system:
    voltage: 12.0 # V
    capacity: 24.0 # Ahr
    charging_current: 5.0 # A
  mechanical_system:
    mass: 10.0 # kg
    moment_of_inertia: 10.0 #kgm^2
    friction_coefficient: 0.20
  ambient_system:
    power: 20.0 # W
  tool_system:
    power: 0.0 # W
  recharge_threshold: 0.20 # Battery level below which robots in this fleet will not operate
  recharge_soc: 1.0 # Battery level to which robots in this fleet should be charged up to during recharging tasks
  publish_fleet_state: 0.5
  account_for_battery_drain: True
  task_capabilities: # Specify the types of RMF Tasks that robots in this fleet are capable of performing
    loop: True
    delivery: False
    clean: False
  actions: ["inorbit"]
  robots:
    andino1_620918333:
      robot_config:
        max_delay: 15.0
      rmf_config:
        robot_state_update_frequency: 0.5
        start:
          map_name: "L1"
          waypoint: "spawn_robot1"
          orientation: 0.0
        charger:
          waypoint: "spawn_robot1"

fleet_manager:
  prefix: "https://api.inorbit.ai/"
  timeout: 5.0
  api_key: "6_n2kuw8gi88XUJ6"
